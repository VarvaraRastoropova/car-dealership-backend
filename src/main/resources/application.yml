spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/car_dealership
    username: postgres
    password: postgres
  liquibase:
    change-log: classpath:db/changelog/changelog.xml
    enabled: true
    parameters:
      SEED_COUNT: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/car-dealership