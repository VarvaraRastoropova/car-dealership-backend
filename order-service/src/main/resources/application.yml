server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: postgres
    password: postgres
  liquibase:
    change-log: classpath:db/changelog/changelog.xml
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/car-dealership
  rabbitmq:
    host: localhost
    port: 5672
    username: rabbit
    password: rabbit
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
        default-requeue-rejected: true