plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '3.2.0' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
    id 'com.google.protobuf' version '0.9.4' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.google.protobuf'

    ext['testcontainers.version'] = '1.21.4'

    group = 'ru.rastoropova'
    version = '1.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.liquibase:liquibase-core'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

        implementation 'org.mapstruct:mapstruct:1.5.5.Final'

        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

        implementation 'io.grpc:grpc-protobuf'
        implementation 'io.grpc:grpc-stub'
        implementation 'javax.annotation:javax.annotation-api:1.3.2'

        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.testcontainers:junit-jupiter'
        testImplementation 'org.testcontainers:postgresql'
        testImplementation 'org.mockito:mockito-core:5.14.2'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.security:spring-security-oauth2-jose'
        testImplementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'
        testImplementation 'org.springframework.security:spring-security-test'
        testImplementation 'org.testcontainers:rabbitmq'

        compileOnly 'org.projectlombok:lombok:1.18.42'
        implementation 'org.postgresql:postgresql:42.7.4'

        annotationProcessor 'org.projectlombok:lombok:1.18.42'
        annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

        testCompileOnly 'org.projectlombok:lombok:1.18.42'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'

        implementation("org.springframework.boot:spring-boot-starter-amqp")
    }

    protobuf {
        protoc {
            artifact = 'com.google.protobuf:protoc:3.25.1'
        }
        plugins {
            grpc {
                artifact = 'io.grpc:protoc-gen-grpc-java:1.60.1'
            }
        }
        generateProtoTasks {
            all()*.plugins {
                grpc {}
            }
        }
    }

    configurations {
        integrationTestImplementation.extendsFrom testImplementation
        integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    }

    sourceSets {
        main {
            proto {
                srcDir 'src/main/java/ru/rastoropova/proto'
            }
        }
        integrationTest {
            java.srcDir file('src/integrationTest/java')
            resources.srcDir file('src/integrationTest/resources')
            compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
            runtimeClasspath += output + compileClasspath
        }
    }

    idea {
        module {
            testSources.from sourceSets.integrationTest.java.srcDirs
            testResources.from sourceSets.integrationTest.resources.srcDirs
            generatedSourceDirs += file('build/generated/source/proto/main/grpc')
            generatedSourceDirs += file('build/generated/source/proto/main/java')
        }
    }

    tasks.register('integrationTest', Test) {
        description = 'Runs integration tests.'
        group = 'verification'
        testClassesDirs = sourceSets.integrationTest.output.classesDirs
        classpath = sourceSets.integrationTest.runtimeClasspath
        useJUnitPlatform()
        shouldRunAfter test
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat = 'full'
        }
    }

    tasks.named('processIntegrationTestResources') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    test {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
        }
    }
}
