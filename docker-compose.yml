services:
  order_db:
    image: postgres:15
    container_name: order_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
    ports:
      - "${ORDER_DB_PORT}:5432"
    volumes:
      - ./data/order_db:/var/lib/postgresql/data

  storage_db:
    image: postgres:15
    container_name: storage_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${STORAGE_DB_NAME}
    ports:
      - "${STORAGE_DB_PORT}:5432"
    volumes:
      - ./data/storage_db:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    platform: linux/amd64
    container_name: keycloak.openid-provider
    env_file:
      - .env
    command:
      - start-dev
      - --import-realm
    ports:
      - 8081:8080
    volumes:
      - ./keycloak/:/opt/keycloak/data/import/

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"