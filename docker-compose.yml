services:
  db:
    image: postgres:15
    container_name: car_dealership_db
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    platform: linux/amd64
    container_name: keycloak.openid-provider
    env_file:
      - .env
    command:
      - start-dev
      - --import-realm
    ports:
      - 8081:8080
    volumes:
      - ./keycloak/:/opt/keycloak/data/import/